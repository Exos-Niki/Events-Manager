<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gather – Event Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f2ff;--surface:#fff;--ink:#1b1035;--muted:#6b6388;--line:#e3dbf7;--pink:#e5287a;--cyan:#0aa5d6;--gold:#d9a400;--glow:rgba(229,40,122,.18);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150c2b;--surface:#21143f;--ink:#f4efff;--muted:#a79cc9;--line:#37275e;--pink:#ff4d94;--cyan:#4fd8ff;--gold:#ffe06b;--glow:rgba(255,77,148,.22);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150c2b;--surface:#21143f;--ink:#f4efff;--muted:#a79cc9;--line:#37275e;--pink:#ff4d94;--cyan:#4fd8ff;--gold:#ffe06b;--glow:rgba(255,77,148,.22);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;line-height:1.05}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#glow{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;z-index:0;transform:translate(-50%,-50%);left:50%;top:30%}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:20px 20px 80px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-radius:999px;background:color-mix(in srgb,var(--surface) 42%,transparent);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);box-shadow:0 10px 34px -14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:padding .3s,box-shadow .3s,background .3s}
nav.small{padding:6px 12px;background:color-mix(in srgb,var(--surface) 62%,transparent);box-shadow:0 14px 40px -12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.links{position:relative;display:flex;gap:2px}
.links a{position:relative;z-index:1;padding:7px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;transition:color .25s}
.links a:hover{color:var(--ink)}
.links a.on{color:#fff}
.pill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:linear-gradient(120deg,var(--pink),var(--cyan));box-shadow:0 4px 14px var(--glow);transition:transform .45s cubic-bezier(.2,1.3,.4,1),width .45s}
.act{display:flex;gap:8px;align-items:center}
.add.sm{padding:8px 16px}
#top,#stats,#events{scroll-margin-top:90px}
@media (max-width:600px){.logo b{display:none}.links a{padding:6px 10px;font-size:.88rem}.act .add{display:none}}
.logo{font:800 1.5rem "Bricolage Grotesque",sans-serif;display:flex;gap:8px;align-items:center}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 var(--pink);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
button{font:inherit;cursor:pointer;color:inherit}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;transition:transform .2s,border-color .2s}
.ghost:hover{transform:translateY(-2px);border-color:var(--pink)}
.hero{padding:56px 0 28px;display:grid;gap:32px}
h1{font-size:clamp(2.8rem,9vw,6.5rem);font-weight:800;letter-spacing:-.03em}
h1 .ch{display:inline-block;opacity:0;transform:translateY(60%) rotate(8deg);animation:drop .7s cubic-bezier(.2,1.4,.4,1) forwards}
h1 .pk{color:var(--pink)}
@keyframes drop{to{opacity:1;transform:none}}
.sub{color:var(--muted);max-width:46ch;font-size:1.1rem}
.next{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px;width:fit-content;max-width:100%}
.next b{font-family:"Bricolage Grotesque";font-size:1.15rem}
.clock{display:flex;gap:8px}
.cell{min-width:56px;text-align:center;background:var(--bg);border-radius:12px;padding:6px 8px;border:1px solid var(--line)}
.cell span{display:block;font:800 1.6rem "Bricolage Grotesque";font-variant-numeric:tabular-nums}
.cell span.flip{animation:flip .45s}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.cell small{color:var(--muted);font-size:.7rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0 28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat strong{font:800 2rem "Bricolage Grotesque";display:block}
.stat small{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.bar input{flex:1 1 200px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--ink);font:inherit;outline:none;transition:box-shadow .3s}
.bar input:focus{box-shadow:0 0 0 3px var(--glow);border-color:var(--pink)}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;transition:all .25s}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.06)}
.add{background:linear-gradient(120deg,var(--pink),var(--cyan));background-size:200% 100%;border:0;border-radius:999px;padding:11px 20px;color:#fff;font-weight:700;transition:background-position .5s,transform .2s}
.add:hover{background-position:100% 0;transform:translateY(-2px) scale(1.03)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;perspective:1000px}
.card{--c:var(--pink);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;overflow:hidden;transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .3s;animation:pop .55s cubic-bezier(.2,1.3,.4,1) backwards}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.18),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{box-shadow:0 18px 40px -18px var(--c)}
.card:hover::after{opacity:1}
.card.out{animation:out .4s forwards}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}}
@keyframes out{to{opacity:0;transform:scale(.7) rotate(-6deg)}}
.tag{display:inline-block;font-size:.78rem;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 10px}
.card h3{font-size:1.4rem;margin:12px 0 6px}
.meta{color:var(--muted);font-size:.92rem;display:grid;gap:2px}
.when{margin-top:12px;font-weight:700;color:var(--c)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.rsvp{background:transparent;border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:8px 16px;font-weight:700;transition:all .25s;position:relative}
.rsvp.yes{background:var(--c);color:#fff}
.rsvp:active{transform:scale(.92)}
.del{background:none;border:0;color:var(--muted);font-size:1.2rem;transition:transform .3s,color .3s}
.del:hover{color:var(--pink);transform:rotate(90deg)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(10,5,25,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;padding:16px}
.modal.open{opacity:1;pointer-events:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;width:min(440px,100%);display:grid;gap:12px;transform:translateY(40px) scale(.92);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.modal.open .sheet{transform:none}
.sheet label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
.sheet input,.sheet select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;transition:transform .45s cubic-bezier(.2,1.4,.4,1);z-index:20}
.toast.show{transform:translate(-50%,0)}
.bit{position:fixed;width:8px;height:12px;z-index:30;pointer-events:none;border-radius:2px}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
/* glass v2 */
nav{background:linear-gradient(135deg,color-mix(in srgb,var(--surface) 58%,transparent),color-mix(in srgb,var(--surface) 22%,transparent));backdrop-filter:blur(26px) saturate(200%) brightness(1.05);-webkit-backdrop-filter:blur(26px) saturate(200%) brightness(1.05);border:1px solid color-mix(in srgb,#fff 30%,transparent);box-shadow:0 14px 44px -14px rgba(20,10,50,.55),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1);transition:padding .3s,box-shadow .3s,background .3s,transform .4s cubic-bezier(.2,1,.3,1)}
nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%) no-repeat;background-size:250% 100%;background-position:150% 0;animation:shine 7s 1.5s infinite}
nav::after{content:"";position:absolute;left:24px;right:24px;bottom:2px;height:2px;border-radius:2px;pointer-events:none;background:linear-gradient(90deg,var(--pink),var(--cyan)) no-repeat;background-size:var(--p,0%) 100%}
@keyframes shine{0%{background-position:150% 0}25%,100%{background-position:-50% 0}}
kbd{font:500 .72rem "DM Sans",sans-serif;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:4px;color:var(--muted)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.dock{display:none;position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,430px);justify-content:space-around;align-items:center;padding:8px 10px;border-radius:28px;z-index:6;background:linear-gradient(135deg,color-mix(in srgb,var(--surface) 62%,transparent),color-mix(in srgb,var(--surface) 28%,transparent));backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);border:1px solid color-mix(in srgb,#fff 30%,transparent);box-shadow:0 16px 40px -10px rgba(20,10,50,.6),inset 0 1px 0 rgba(255,255,255,.55)}
.dock a,.dock .tab{flex:1;display:grid;justify-items:center;gap:2px;font-size:.7rem;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 0;background:none;border:0;border-radius:16px;position:relative;transition:color .25s}
.dock a.on{color:var(--pink)}
.dock a.on .ic{transform:translateY(-3px) scale(1.18)}
.dock a.on::after{content:"";position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.dock .tab:active .ic,.dock a:active .ic{transform:scale(.85)}
.fab{width:54px;height:54px;flex:none;margin-top:-30px;border-radius:50%;border:0;color:#fff;font-size:2rem;line-height:1;background:linear-gradient(135deg,var(--pink),var(--cyan));box-shadow:0 10px 26px -4px var(--pink),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .25s cubic-bezier(.2,1.5,.4,1);animation:ping 2.4s infinite}
.fab:active{transform:scale(.88) rotate(90deg)}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr))}
.sheet{max-height:90vh;overflow:auto}
@media (max-width:900px){.act .add,#sbtn kbd{display:none}}
@media (max-width:700px){nav{padding:8px 14px;gap:8px}nav.hide{transform:translateY(-160%)}.logo b{display:inline}.links,.act .add,#sbtn{display:none}.dock{display:flex}.wrap{padding-bottom:140px}.hero{padding-top:36px}.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}}
@media (max-width:420px){.cell{min-width:46px}.cell span{font-size:1.3rem}.clock{gap:6px}.next{padding:14px}}
/* nav responsive v3 */
nav{padding:clamp(6px,1.2vw,10px) clamp(10px,2vw,18px);gap:clamp(6px,1.5vw,14px)}
.logo{flex:none;font-size:clamp(1.2rem,2.4vw,1.5rem)}
.links{min-width:0}
#theme,#sbtn{display:inline-flex;align-items:center;gap:6px}
#theme .ic,#sbtn .ic{width:18px;height:18px}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.dock{transition:transform .35s cubic-bezier(.2,1,.3,1)}
body.typing .dock{transform:translate(-50%,180%)}
@media (max-width:820px){.links a{padding:7px 11px;font-size:.92rem}#sbtn{padding:8px 12px}}
@media (max-width:700px){#theme{padding:0;width:42px;height:42px;justify-content:center}#theme .lbl{display:none}.dock a,.dock .tab{min-height:48px;align-content:center}}
@media (max-width:360px){.dock{width:96vw;padding:6px}.dock a,.dock .tab{font-size:.64rem}.fab{width:48px;height:48px;margin-top:-26px}.logo b{display:none}}
@media (max-height:480px) and (orientation:landscape){nav.hide{transform:translateY(-160%)}.links,.act .add,#sbtn{display:none}#theme{padding:0;width:38px;height:38px;justify-content:center}#theme .lbl{display:none}.dock{display:flex;padding:4px 8px;bottom:calc(6px + env(safe-area-inset-bottom,0px))}.dock a,.dock .tab{font-size:0;min-height:40px;align-content:center}.dock .ic{width:20px;height:20px}.fab{margin-top:-18px;width:44px;height:44px}.hero{padding-top:16px}.wrap{padding-bottom:90px}}
@media (hover:none){.ghost:hover,.add:hover{transform:none}}
.act .add{display:inline-block;padding:8px 16px}
nav.hide{transform:none}
.wrap{padding-bottom:80px}
.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:420px){.act .add{padding:8px 12px;font-size:.9rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}#bg{display:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div id="glow"></div>
<div class="wrap">
  <nav id="nav"><div class="logo"><i></i><b>Gather</b></div><div class="act"><button class="ghost" id="theme" aria-label="Toggle theme"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></svg><span class="lbl">Theme</span></button><button class="add sm" id="open2">New event</button></div></nav>
  <header class="hero" id="top">
    <h1 id="title" aria-label="Plan it. Pack the room."></h1>
    <p class="sub">Create events, track RSVPs, and watch the countdown to whatever is coming next.</p>
  </header>
  <section class="stats" id="stats"></section>
  <div class="bar" id="events">
    <input id="q" type="search" placeholder="Search events or places" aria-label="Search events">
    <span id="chips"></span>
    <button class="add" id="open">New event</button>
  </div>
  <main class="grid" id="grid"></main>
</div>
<div class="modal" id="modal"><form class="sheet" id="form" onsubmit="return false">
  <h2>New event</h2>
  <label>Name<input id="f-name" required maxlength="50"></label>
  <label>Date and time<input id="f-date" type="datetime-local" required></label>
  <label>Place<input id="f-place" maxlength="50" value="Main hall"></label>
  <label>Category<select id="f-cat"></select></label>
  <label>Capacity<input id="f-cap" type="number" min="1" value="50"></label>
  <div class="btns"><button type="button" class="ghost" id="cancel">Cancel</button><button type="button" class="add" id="save">Create event</button></div>
</form></div>
<div class="toast" id="toast"></div>
<script>
const CATS={Music:"#ff4d94",Tech:"#1fb8e6",Food:"#f0a500",Sports:"#2fc486",Art:"#9a6bff"};
const $=s=>document.querySelector(s);
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);d.setHours(18,0,0,0);return d.getTime()};
let events=[],filter="All",query="";
try{events=JSON.parse(localStorage.getItem("gather-events")||"[]")}catch(e){}
if(!events.length)events=[
 {id:1,name:"Rooftop Jam Night",at:day(2),place:"Skyline Terrace",cat:"Music",cap:120,going:84,rsvp:false},
 {id:2,name:"Hack & Chill",at:day(5),place:"Innovation Lab",cat:"Tech",cap:60,going:41,rsvp:true},
 {id:3,name:"Street Food Fair",at:day(9),place:"Central Square",cat:"Food",cap:300,going:212,rsvp:false},
 {id:4,name:"5K Sunrise Run",at:day(12),place:"Lakeside Park",cat:"Sports",cap:150,going:96,rsvp:false},
 {id:5,name:"Live Mural Workshop",at:day(16),place:"Studio 9",cat:"Art",cap:30,going:22,rsvp:false}];
const save=()=>{try{localStorage.setItem("gather-events",JSON.stringify(events))}catch(e){}};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function confetti(x,y){for(let i=0;i<26;i++){const b=document.createElement("i");b.className="bit";b.style.cssText=`left:${x}px;top:${y}px;background:${Object.values(CATS)[i%5]}`;document.body.appendChild(b);const a=Math.random()*Math.PI*2,v=60+Math.random()*120;b.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+120}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:900+Math.random()*500,easing:"cubic-bezier(.2,.8,.4,1)"}).onfinish=()=>b.remove()}}
function countUp(el,to){const s=performance.now();(function f(t){const p=Math.min(1,(t-s)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)}
// hero title: one orchestrated letter drop
(function(){const t="Plan it. Pack the room.";let h="",i=0;for(const w of t.split(" ")){h+='<span style="display:inline-block;white-space:nowrap">';for(const c of w){h+=`<span class="ch${w.startsWith("room")?" pk":""}" style="animation-delay:${i++*40}ms">${c}</span>`}h+="</span> "}$("#title").innerHTML=h})();
// stats
function renderStats(){const up=events.filter(e=>e.at>Date.now());const s=[["Events",events.length],["Upcoming",up.length],["You're going",events.filter(e=>e.rsvp).length],["Total guests",events.reduce((a,e)=>a+e.going,0)]];
$("#stats").innerHTML=s.map(([l])=>`<div class="stat"><strong>0</strong><small>${l}</small></div>`).join("");document.querySelectorAll(".stat strong").forEach((el,i)=>countUp(el,s[i][1]))}
// chips
function renderChips(){$("#chips").innerHTML=["All",...Object.keys(CATS)].map(c=>`<button class="chip ${c===filter?"on":""}" data-c="${c}">${c}</button>`).join(" ")}
$("#chips").onclick=e=>{const c=e.target.dataset.c;if(!c)return;filter=c;renderChips();renderGrid()};
$("#q").oninput=e=>{query=e.target.value.toLowerCase();renderGrid()};
$("#f-cat").innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join("");
// grid
function renderGrid(){const list=events.filter(e=>(filter==="All"||e.cat===filter)&&(e.name+e.place).toLowerCase().includes(query)).sort((a,b)=>a.at-b.at);
$("#grid").innerHTML=list.length?list.map((e,i)=>{const d=new Date(e.at),past=e.at<Date.now(),pct=Math.min(100,Math.round(e.going/e.cap*100));
return `<article class="card" data-id="${e.id}" style="--c:${CATS[e.cat]};animation-delay:${i*70}ms"><span class="tag">${e.cat}</span><h3>${e.name.replace(/</g,"&lt;")}</h3>
<div class="meta"><span>${d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})} at ${d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span><span>${e.place.replace(/</g,"&lt;")}</span><span>${e.going} of ${e.cap} spots filled (${pct}%)</span></div>
<div class="when">${past?"Ended":rel(e.at)}</div>
<div class="row"><button class="rsvp ${e.rsvp?"yes":""}" ${past?"disabled":""}>${e.rsvp?"You're going":"RSVP"}</button><button class="del" aria-label="Delete ${e.name.replace(/"/g,"")}">✕</button></div></article>`}).join(""):'<p class="empty">No events match. Create one with “New event”.</p>'}
function rel(t){const d=Math.ceil((t-Date.now())/864e5);return d<=0?"Today":d===1?"Tomorrow":`In ${d} days`}
$("#grid").onclick=e=>{const card=e.target.closest(".card");if(!card)return;const ev=events.find(x=>x.id==card.dataset.id);
if(e.target.closest(".rsvp")){ev.rsvp=!ev.rsvp;ev.going+=ev.rsvp?1:-1;save();if(ev.rsvp){const r=e.target.getBoundingClientRect();confetti(r.left+r.width/2,r.top);toast("You're going to "+ev.name)}else toast("RSVP removed");const b=e.target.closest(".rsvp");b.classList.toggle("yes",ev.rsvp);b.textContent=ev.rsvp?"You're going":"RSVP";renderStats()}
if(e.target.closest(".del")){card.classList.add("out");setTimeout(()=>{events=events.filter(x=>x!==ev);save();renderGrid();renderStats();renderNext();toast("Event deleted")},380)}};
// 3D tilt + glare
$("#grid").onmousemove=e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.transform=`rotateY(${(x-.5)*10}deg) rotateX(${(.5-y)*10}deg) translateZ(6px)`;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%")};
$("#grid").onmouseout=e=>{const c=e.target.closest(".card");if(c&&!c.contains(e.relatedTarget))c.style.transform=""};
// countdown
let prev={};
function renderNext(){if(!$("#next"))return;const n=events.filter(e=>e.at>Date.now()).sort((a,b)=>a.at-b.at)[0],el=$("#next");
if(!n){el.innerHTML="<b>Nothing scheduled yet. Add your first event.</b>";return}
const ms=n.at-Date.now(),v={Days:Math.floor(ms/864e5),Hrs:Math.floor(ms/36e5%24),Min:Math.floor(ms/6e4%60),Sec:Math.floor(ms/1e3%60)};
if(!el.dataset.id||el.dataset.id!=n.id){el.dataset.id=n.id;el.innerHTML=`<div><small>Next up</small><br><b>${n.name.replace(/</g,"&lt;")}</b></div><div class="clock">${Object.keys(v).map(k=>`<div class="cell"><span data-k="${k}">00</span><small>${k}</small></div>`).join("")}</div>`;prev={}}
for(const k in v){const s=el.querySelector(`[data-k="${k}"]`),t=String(v[k]).padStart(2,"0");if(prev[k]!==t){s.textContent=t;s.classList.remove("flip");void s.offsetWidth;s.classList.add("flip");prev[k]=t}}}
setInterval(renderNext,1000);
// modal
const m=$("#modal");
$("#open").onclick=()=>{$("#f-date").value=new Date(Date.now()+864e5*3-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);m.classList.add("open");$("#f-name").focus()};
const close=()=>m.classList.remove("open");$("#cancel").onclick=close;m.onclick=e=>{if(e.target===m)close()};
document.onkeydown=e=>{if(e.key==="Escape")close()};
$("#save").onclick=e=>{const n=$("#f-name").value.trim(),d=new Date($("#f-date").value).getTime();if(!n||isNaN(d)){toast("Add a name and a date");return}
events.push({id:Date.now(),name:n,at:d,place:$("#f-place").value||"TBA",cat:$("#f-cat").value,cap:+$("#f-cap").value||50,going:0,rsvp:false});save();close();$("#form").reset();renderGrid();renderStats();renderNext();const r=e.target.getBoundingClientRect();confetti(innerWidth/2,innerHeight/2);toast("Event created")};
// theme
$("#theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
// glow follows cursor
const g=$("#glow");addEventListener("pointermove",e=>{g.style.left=e.clientX+"px";g.style.top=e.clientY+"px"});
// particles
const cv=$("#bg"),cx=cv.getContext("2d");let P=[],mx=-999,my=-999;
function size(){cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:Math.min(70,innerWidth/18|0)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*2+1,c:Object.values(CATS)[Math.random()*5|0]}))}
addEventListener("resize",size);addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});size();
(function loop(){cx.clearRect(0,0,cv.width,cv.height);for(const p of P){const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<120){p.x+=dx/d*2;p.y+=dy/d*2}p.x=(p.x+p.vx+cv.width)%cv.width;p.y=(p.y+p.vy+cv.height)%cv.height;cx.globalAlpha=.55;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
cx.lineWidth=.6;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<110){cx.globalAlpha=(1-d/110)*.25;cx.strokeStyle=P[i].c;cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}requestAnimationFrame(loop)})();
// glass navbar: sliding pill + scroll spy
const nav=$("#nav"),links=[...document.querySelectorAll("#links a")],pill=document.querySelector(".pill"),secs=links.map(a=>document.querySelector(a.getAttribute("href")));
let cur=links[0];
const dockLinks=[...document.querySelectorAll("#dock a")];
function setPill(a){if(!a||!pill)return;cur=a;pill.style.width=a.offsetWidth+"px";pill.style.transform=`translateX(${a.offsetLeft}px)`;links.forEach(l=>l.classList.toggle("on",l===a));dockLinks.forEach(l=>l.classList.toggle("on",l.getAttribute("href")===a.getAttribute("href")))}
links.forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute("href")).scrollIntoView({behavior:"smooth"})});
let ly=0;addEventListener("scroll",()=>{nav.classList.toggle("small",scrollY>40);nav.style.setProperty("--p",(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)*100)+"%");nav.classList.toggle("hide",scrollY>ly&&scrollY>240);ly=scrollY;let i=0;secs.forEach((s,k)=>{if(s.getBoundingClientRect().top<200)i=k});if(links[i]!==cur)setPill(links[i])},{passive:true});
addEventListener("resize",()=>setPill(cur));addEventListener("load",()=>setPill(cur));setPill(cur);
$("#open2").onclick=()=>$("#open").click();
dockLinks.forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute("href")).scrollIntoView({behavior:"smooth"})});
function goSearch(){$("#events").scrollIntoView({behavior:"smooth"});setTimeout(()=>$("#q").focus({preventScroll:true}),450)}

addEventListener("focusin",e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))document.body.classList.add("typing")});addEventListener("focusout",()=>document.body.classList.remove("typing"));
addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();goSearch()}});
renderChips();renderGrid();renderStats();renderNext();
</script>
</body>
</html>
